name: Sync Terraform provider repository

on:
  push:
    branches: [main]
    paths:
      - "packages/integrations/terraform-provider-phaseo/**"
      - ".github/workflows/sync-terraform-provider.yml"
  workflow_dispatch:

concurrency:
  group: sync-terraform-provider
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/integrations/terraform-provider-phaseo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/integrations/terraform-provider-phaseo/go.mod
          cache-dependency-path: packages/integrations/terraform-provider-phaseo/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build .

  sync:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export provider history
        run: git subtree split --prefix=packages/integrations/terraform-provider-phaseo --branch=terraform-provider-export

      - name: Push provider repository
        env:
          SYNC_TOKEN: ${{ secrets.TERRAFORM_PROVIDER_SYNC_TOKEN }}
        run: |
          test -n "$SYNC_TOKEN" || { echo "TERRAFORM_PROVIDER_SYNC_TOKEN is not configured" >&2; exit 1; }
          git push "https://x-access-token:${SYNC_TOKEN}@github.com/phaseoteam/terraform-provider-phaseo.git" terraform-provider-export:main
