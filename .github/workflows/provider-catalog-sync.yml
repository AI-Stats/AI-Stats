name: Provider Catalog Sync

on:
    repository_dispatch:
        types: [provider-catalog-change]
    workflow_dispatch:
        inputs:
            providers:
                description: Comma-separated discovery provider IDs (blank uses the safe pricing set)
                required: false
                type: string
    schedule:
        - cron: "7,22,37,52 * * * *"
        - cron: "41 2 * * *"

permissions:
    contents: read

jobs:
    providers:
        name: Select providers
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.matrix.outputs.value }}
            has-providers: ${{ steps.matrix.outputs.has_providers }}
        steps:
            - name: Build provider matrix
              id: matrix
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  MANUAL_PROVIDERS: ${{ inputs.providers }}
                  DISPATCH_PROVIDERS: ${{ toJSON(github.event.client_payload.providers) }}
                  SCHEDULE: ${{ github.event.schedule }}
                  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
              shell: bash
              run: |
                  set -euo pipefail
                  safe='["ai21","akashml","aion-labs","arcee-ai","atlascloud","baseten","chutes","crofai","deepinfra","gmicloud","groq","inception","nextbit","novita","spacex-ai","together","venice"]'
                  if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
                    providers="$(jq -c 'map(strings | ascii_downcase) | map(select(test("^[a-z0-9][a-z0-9-]*$"))) | unique' <<<"$DISPATCH_PROVIDERS")"
                  elif [[ -n "${MANUAL_PROVIDERS:-}" ]]; then
                    providers="$(jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "") | ascii_downcase) | map(select(test("^[a-z0-9][a-z0-9-]*$"))) | unique' <<<"$MANUAL_PROVIDERS")"
                  elif [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE" != "41 2 * * *" ]]; then
                    if [[ -z "$NEXT_PUBLIC_SUPABASE_URL" || -z "$SUPABASE_SERVICE_ROLE_KEY" ]]; then
                      echo "Supabase credentials are required for the incremental provider poll." >&2
                      exit 1
                    fi
                    since="$(date -u -d '35 minutes ago' +'%Y-%m-%dT%H:%M:%SZ')"
                    runs="$(curl --fail-with-body --retry 3 --get \
                      --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                      --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                      --data-urlencode 'select=summary' \
                      --data-urlencode "started_at=gte.$since" \
                      --data-urlencode 'order=started_at.desc' \
                      --data-urlencode 'limit=100' \
                      "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/model_discovery_runs")"
                    providers="$(jq -c '[.[].summary | (.changes[]?.providerId, .pricingMonitor.providerChanges[]?.providerId, .providerApiPricingMonitor.providerChanges[]?.providerId, .pricingTableMonitor.providerChanges[]?.providerId)] | map(select(type == "string") | ascii_downcase) | map(select(test("^[a-z0-9][a-z0-9-]*$"))) | unique' <<<"$runs")"
                  else
                    providers="$safe"
                  fi
                  count="$(jq 'length' <<<"$providers")"
                  echo "value=$(jq -cn --argjson providers "$providers" '{provider:$providers}')" >> "$GITHUB_OUTPUT"
                  if [[ "$count" -gt 0 ]]; then
                    echo "has_providers=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "has_providers=false" >> "$GITHUB_OUTPUT"
                  fi

    sync:
        name: Sync ${{ matrix.provider }}
        needs: providers
        if: needs.providers.outputs.has-providers == 'true'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            max-parallel: 6
            matrix: ${{ fromJSON(needs.providers.outputs.matrix) }}
        steps:
            - name: Create GitHub App token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
              with:
                  client-id: ${{ secrets.PHASEO_APP_CLIENT_ID }}
                  private-key: ${{ secrets.PHASEO_APP_PRIVATE_KEY }}

            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  ref: main
                  fetch-depth: 0
                  token: ${{ steps.app-token.outputs.token }}

            - name: Setup pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
              with:
                  version: 10.33.0
                  run_install: false

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Enrich from models.dev
              shell: bash
              run: |
                  catalog_provider="${{ matrix.provider }}"
                  source_provider="$catalog_provider"
                  case "$source_provider" in
                    cloudflare) source_provider="cloudflare-workers-ai" ;;
                    google-ai-studio) source_provider="google" ;;
                    spacex-ai) source_provider="xai" ;;
                    weights-and-biases) source_provider="wandb" ;;
                  esac
                  pnpm --filter @phaseo/web catalog:enrich:models-dev -- \
                    --provider="$source_provider" \
                    --catalog-provider="$catalog_provider" \
                    --existing-providers-only

            - name: Synchronize provider discovery state
              env:
                  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
                  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
              run: pnpm --filter @phaseo/web catalog:sync:provider-discovery -- --provider="${{ matrix.provider }}"

            - name: Validate catalog changes
              run: |
                  pnpm validate:data
                  pnpm validate:pricing
                  pnpm validate:gateway

            - name: Ensure automation labels
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
              shell: bash
              run: |
                  gh label create automation --color 0E8A16 --description "Automated repository change" --force
                  gh label create model-sync --color 1D76DB --description "Automated provider model and pricing sync" --force
                  gh label create "provider:${{ matrix.provider }}" --color C5DEF5 --description "Provider-specific catalog change" --force

            - name: Resolve provider branch
              id: sync-branch
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token }}
                  PROVIDER: ${{ matrix.provider }}
              shell: bash
              run: |
                  prefix="automation/provider-catalog-$PROVIDER"
                  branch="$(gh pr list --state open --json headRefName --jq ".[] | select(.headRefName | startswith(\"$prefix-\")) | .headRefName" | head -n 1)"
                  if [[ -z "$branch" ]]; then
                    branch="$prefix-$GITHUB_RUN_ID"
                  fi
                  echo "branch=$branch" >> "$GITHUB_OUTPUT"

            - name: Create or update provider pull request
              id: pull-request
              uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  branch: ${{ steps.sync-branch.outputs.branch }}
                  base: main
                  delete-branch: false
                  draft: true
                  add-paths: |
                      packages/data/catalog/src/data/api_providers/**
                      packages/data/catalog/src/data/pricing/**
                      packages/data/catalog/src/data/models/**
                  commit-message: "chore(data): sync ${{ matrix.provider }} catalog"
                  title: "chore(data): sync ${{ matrix.provider }} catalog"
                  body-path: apps/web/.sync/provider-catalog-sync.md
                  labels: |
                      automation
                      model-sync
                      provider:${{ matrix.provider }}

            - name: Notify Discord
              if: steps.pull-request.outputs.pull-request-operation != ''
              env:
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
                  PROVIDER: ${{ matrix.provider }}
                  OPERATION: ${{ steps.pull-request.outputs.pull-request-operation }}
              shell: bash
              run: |
                  if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
                    echo "DISCORD_WEBHOOK_URL is not configured; skipping notification."
                    exit 0
                  fi
                  payload="$(jq -cn --arg provider "$PROVIDER" --arg operation "$OPERATION" --arg url "$PR_URL" '{content:("Provider catalog PR " + $operation + " for `" + $provider + "`: " + $url),allowed_mentions:{parse:[]}}')"
                  curl --fail-with-body --retry 3 --header 'Content-Type: application/json' --data "$payload" "$DISCORD_WEBHOOK_URL"
