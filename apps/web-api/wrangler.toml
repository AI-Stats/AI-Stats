name = "phaseo-web-api"
main = "src/index.ts"
compatibility_date = "2026-07-20"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false
preview_urls = false

# Workers Cache is checked before this Worker executes. Public responses opt in
# through their Cache-Control headers; account routes remain private/no-store.
[cache]
enabled = true

[vars]
ENV = "production"
BETTER_AUTH_URL = "https://phaseo.app"
PROFILE_AVATARS_PUBLIC_BASE_URL = "https://avatars.phaseo.app"
# Set by deployment environment; kept out of source configuration.
# STAGING_GATEWAY_BASE_URL = "https://<staging-gateway>/v1"

[[r2_buckets]]
binding = "PROFILE_AVATARS_BUCKET"
bucket_name = "phaseo-profile-avatars"
preview_bucket_name = "phaseo-profile-avatars-preview"

[[hyperdrive]]
binding = "PLANETSCALE_HYPERDRIVE"
id = "31f2d1cba26c46f79705fbb7c22b3a7c"

# PR previews deploy this separately named Worker to the account's workers.dev
# subdomain. It deliberately has no phaseo.app route, so it cannot intercept
# production traffic.
[env.staging]
workers_dev = true
preview_urls = true
routes = []

[env.staging.vars]
ENV = "staging"
BETTER_AUTH_URL = "https://phaseo-planetscale-better-auth.vercel.app"
PROFILE_AVATARS_PUBLIC_BASE_URL = "https://avatars.phaseo.app"
STAGING_GATEWAY_BASE_URL = "https://api-staging.phaseo.app"

[[env.staging.r2_buckets]]
binding = "PROFILE_AVATARS_BUCKET"
bucket_name = "phaseo-profile-avatars-preview"

[[env.staging.hyperdrive]]
binding = "PLANETSCALE_HYPERDRIVE"
id = "31f2d1cba26c46f79705fbb7c22b3a7c"

# Cloudflare owns the explicit application API namespaces below. Vercel owns
# page rendering and normal web assets, but no application API handlers.
[[routes]]
pattern = "phaseo.app/api/_web/*"
zone_name = "phaseo.app"

[[routes]]
pattern = "phaseo.app/api/account/*"
zone_name = "phaseo.app"

[[routes]]
pattern = "phaseo.app/api/chat/*"
zone_name = "phaseo.app"

[[routes]]
pattern = "phaseo.app/api/internal/*"
zone_name = "phaseo.app"

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
